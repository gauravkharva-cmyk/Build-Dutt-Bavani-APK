plugins { id 'com.android.application' }

android {
    namespace 'com.gk.tonegenerator'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gk.tonegenerator'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
