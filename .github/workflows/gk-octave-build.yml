name: Build GK Octave Analyzer APK
on:
  pull_request:
    paths:
      - 'gk-octave-app/**'
      - '.github/workflows/gk-octave-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 from runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Retain ONE debug signing identity across builds of this isolated test app.
      # Do not use this debug signing setup for production releases.
      - name: Restore stable debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gk-octave-stable-debug-signing-20261031-v1
      - name: Ensure consistent debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Build APK
        working-directory: gk-octave-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GK-Octave-Analyzer-APK
          path: gk-octave-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
