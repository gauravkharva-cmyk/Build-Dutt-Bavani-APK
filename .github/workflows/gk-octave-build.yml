name: Build GK Octave Analyzer APK
on:
  pull_request:
    paths:
      - 'gk-octave-app/**'
      - '.github/workflows/gk-octave-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 from runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Retain ONE debug signing identity across builds of this isolated test app.
      # Do not use this debug signing setup for production releases.
      - name: Restore stable debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gk-octave-stable-debug-signing-20261031-v1
      - name: Ensure consistent debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Build APK
        working-directory: gk-octave-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GK-Octave-Analyzer-APK
          path: gk-octave-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download on isolated feature branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'gk-octave-analyzer-apk-build' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          BRANCH: gk-octave-analyzer-apk-build
        run: |
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p downloads
          cp gk-octave-app/app/build/outputs/apk/debug/app-debug.apk downloads/GK-Motor-Octave-Analyzer-v2.1.apk
          git add downloads/GK-Motor-Octave-Analyzer-v2.1.apk
          if git diff --cached --quiet; then
            echo "Installer unchanged; already published."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish motor octave analyzer v2.1 APK on isolated branch"
            git push origin HEAD:"$BRANCH"
          fi
