name: Build OSHO World Premium APK
on:
  push:
    branches:
      - oshoworld-premium
    paths:
      - 'oshoworld/**'
      - '.github/workflows/build-oshoworld.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check official OSHO World audio API
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,urllib.request,re
          base='https://oshoworld.com'
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json','Content-Type':'application/json'}
          def post(path,payload):
              req=urllib.request.Request(base+path,method='POST',headers=H,data=json.dumps(payload).encode())
              return json.load(urllib.request.urlopen(req,timeout=20))
          try:
              page=urllib.request.urlopen(urllib.request.Request(base,headers=H),timeout=20).read().decode()
              b=re.search(r'"buildId":"([^"]+)"',page)
              print('BUILD ID',b.group(1) if b else 'missing')
          except Exception as e: print('BUILD ID error',repr(e));b=None
          for lang in ['english','hindi']:
              try:
                  j=post('/api/server/audio/search-series-home',{'page':1,'sortBy':'name','language':lang})
                  print('SERIES',lang,'keys',list(j),'count',j.get('total'),'first',j.get('items',[])[:1])
                  s=j.get('items',[])[0]
                  print('SERIES ITEM KEYS',list(s))
                  if b:
                      slug=s.get('slug')
                      u=base+'/_next/data/'+b.group(1)+'/'+slug+'.json'
                      page=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20))
                      pd=page['pageProps']['data']['pageData']
                      print('PAGE DATA',lang,'keys',list(pd),'CATEGORY',pd.get('categoryData',{}).get('_id'))
                      sid=pd.get('categoryData',{}).get('_id')
                      if sid:
                          eps=post('/api/server/audio/series-filter',{'currentId':sid,'page':1,'perPage':10,'search':''})
                          print('EPISODES',lang,'total',eps.get('total'),'first',eps.get('listData',[])[:1])
              except Exception as e:print('SERIES ERROR',lang,repr(e))
          PY
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace -p oshoworld :app:assembleDebug
      - name: Upload OSHO World APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OSHO-World-Premium-APK
          path: oshoworld/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
