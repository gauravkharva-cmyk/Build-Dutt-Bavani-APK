name: Build OSHO World Premium APK
on:
  push:
    branches:
      - oshoworld-premium
    paths:
      - 'oshoworld/**'
      - '.github/workflows/build-oshoworld.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Inspect public catalog repositories
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,urllib.request
          targets=['aagrawal207/OshoDiscourses','mksonkar/oshoworld-discourse-downloader','SurjitSahoo/oshoworld-discourse-downloader']
          for repo in targets:
              try:
                  req=urllib.request.Request('https://api.github.com/repos/'+repo,headers={'User-Agent':'OSHO-Android-Build'})
                  j=json.load(urllib.request.urlopen(req,timeout=15))
                  print('REPO',repo,'DEFAULT',j.get('default_branch'),'PRIVATE',j.get('private'))
                  branch=j['default_branch']
                  req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/trees/'+branch+'?recursive=1',headers={'User-Agent':'OSHO-Android-Build'})
                  t=json.load(urllib.request.urlopen(req,timeout=15))
                  paths=[x.get('path','') for x in t.get('tree',[])]
                  print('CATALOG PATHS',[p for p in paths if 'catalog' in p.lower() or 'download' in p.lower()][:35])
                  if 'mksonkar' in repo:
                      path='downloader.py'
                      s=urllib.request.urlopen('https://raw.githubusercontent.com/'+repo+'/'+branch+'/'+path,timeout=15).read().decode()
                      lines=s.splitlines()
                      for i,line in enumerate(lines):
                          if any(v in line.lower() for v in ['endpoint','api/','get_audios','get-series','requests.get','audio-english-home','audio-hindi-home','base_url']):
                              print('CODE',i+1,line.strip()[:200])
              except Exception as e: print('REPO ERROR',repo,repr(e))
          PY
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace -p oshoworld :app:assembleDebug
      - name: Upload OSHO World APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OSHO-World-Premium-APK
          path: oshoworld/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
