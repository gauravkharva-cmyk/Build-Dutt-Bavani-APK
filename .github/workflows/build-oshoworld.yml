name: Build OSHO World Premium APK
on:
  push:
    branches:
      - oshoworld-premium
    paths:
      - 'oshoworld/**'
      - '.github/workflows/build-oshoworld.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace -p oshoworld :app:assembleDebug
      - name: Upload OSHO World APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OSHO-World-Premium-APK
          path: oshoworld/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
