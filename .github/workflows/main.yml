name: Build Dutt Bavani APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Dutt Bavani project
        shell: bash
        run: |
          shopt -s nullglob
          files=(Dutt_Bavani_Android_Project*.zip)
          if (( ${#files[@]} != 1 )); then
            echo "ERROR: Upload exactly ONE Dutt_Bavani_Android_Project*.zip to the repository root."
            printf 'Found: %s\n' "${files[*]}"
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "${files[0]}" -d unpacked
          test -f unpacked/Dutt_Bavani_Android/app/build.gradle || {
            echo "ERROR: Project structure not found inside ZIP."
            exit 1
          }

      - name: Build installable debug APK
        run: gradle --no-daemon -p unpacked/Dutt_Bavani_Android assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dutt-Bavani-APK
          path: unpacked/Dutt_Bavani_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
