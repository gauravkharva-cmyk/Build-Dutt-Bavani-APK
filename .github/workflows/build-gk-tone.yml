name: Build GK Tone Generator APK
on:
  push:
    branches: [build-gk-tone-generator]
    paths: [ 'gk-tone/**', '.github/workflows/build-gk-tone.yml' ]
  pull_request:
    branches: [main]
    paths: [ 'gk-tone/**', '.github/workflows/build-gk-tone.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gk-tone
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GK-Tone-Generator-APK
          path: gk-tone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
