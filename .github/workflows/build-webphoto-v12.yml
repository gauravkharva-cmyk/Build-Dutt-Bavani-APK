name: Build Web Photo to PPT v1.2 - Large MHT fix
on:
  push:
    branches:
      - webphoto-to-ppt-20261026
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project and apply streaming MHT fix
        run: |
          base64 -d webphoto-v11-source.b64 | tar -xz
          cp webphoto-v12-patch/MhtmlSectionStreamer.java app/src/main/java/com/gauravkharva/webphotoppt/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/gauravkharva/webphotoppt/WebPhotoExtractor.java')
          s=p.read_text()
          old='byte[] bytes = readLimited(input, MAX_WEB_ARCHIVE_BYTES);\n        MhtmlArchiveReader.Report report = MhtmlArchiveReader.parse(bytes,'
          new='MhtmlArchiveReader.Report report = MhtmlSectionStreamer.parse(input,'
          assert old in s, 'Failed to locate v1.1 MHT import function'
          s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 2','versionCode 3').replace("versionName '1.1'","versionName '1.2'")
          p.write_text(s)
          PY
          test -f app/src/main/java/com/gauravkharva/webphotoppt/MhtmlSectionStreamer.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK file
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: WebPhotoToPPT-v1_2-Large-MHT-Fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
