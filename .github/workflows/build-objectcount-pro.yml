name: ObjectCount PRO - Build offline APK
on:
  push:
    branches: [objectcount-pro-apk-direct-20261121]
    paths:
      - 'ObjectCountPro/**'
      - '.github/workflows/build-objectcount-pro.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK
        run: |
          set -euxo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Bundle offline object detection AI
        run: |
          set -euxo pipefail
          mkdir -p ObjectCountPro/app/src/main/assets
          curl -fLsS --retry 5 --retry-delay 5 \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite" \
            -o ObjectCountPro/app/src/main/assets/efficientdet-lite0.tflite
          test "$(stat -c %s ObjectCountPro/app/src/main/assets/efficientdet-lite0.tflite)" -gt 3500000
          sha256sum ObjectCountPro/app/src/main/assets/efficientdet-lite0.tflite

      - name: Build installable APK
        working-directory: ObjectCountPro
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK and copy
        run: |
          set -euxo pipefail
          APK=ObjectCountPro/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/efficientdet-lite0.tflite'
          cp "$APK" ObjectCountPRO.apk
          du -h ObjectCountPRO.apk
          sha256sum ObjectCountPRO.apk

      - name: Publish APK as downloadable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release create "objectcountpro-direct-v1.0-20261121" \
            "ObjectCountPRO.apk" \
            --title "ObjectCount PRO v1.0 - Offline Android APK" \
            --notes "Installable ARM64 Android APK. Gallery/camera image counting, 80 COCO object categories, confidence control, enhanced scan, manual corrections, and annotated export. Fully offline after installation." \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
